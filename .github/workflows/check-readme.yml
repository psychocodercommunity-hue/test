name: Check README

# WHEN: run on every push to main
on:
  push:
    branches: [ main ]

jobs:
  check-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Get my code
        uses: actions/checkout@v4

      - name: Check if README exists
        run: |
          if [ -f README.md ]; then
            echo "✅ README.md found — all good!"
          else
            echo "❌ README.md is missing!"
            exit 1
          fi